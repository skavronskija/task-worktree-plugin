name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches plugin.xml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          XML_VERSION=$(grep -oE '<version>[^<]+</version>' src/main/resources/META-INF/plugin.xml | head -1 | sed 's/<[^>]*>//g')
          echo "Tag version:        $TAG"
          echo "plugin.xml version: $XML_VERSION"
          if [ "$TAG" != "$XML_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match plugin.xml version $XML_VERSION"
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin

      # Basic validation only. The full IDE-compatibility check (./gradlew verifyPlugin, which
      # downloads several IDE distributions) is run locally — see the pluginVerification block in
      # build.gradle.kts — and is intentionally kept out of CI.
      - name: Validate plugin
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
